<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>tmux-webhub — access</title>
<style>
  :root { --bg: #14161a; --panel: #1c1f26; --border: #2a2e37; --text: #d7dae0; --dim: #8b909c; --accent: #4f8cff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  .card {
    width: 340px; max-width: calc(100vw - 24px);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 28px 26px;
  }
  /* keep the card clear of the iOS home indicator (no-op where env() is unsupported) */
  .card { padding-bottom: max(28px, env(safe-area-inset-bottom)); }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: var(--dim); font-size: 13px; }
  input {
    width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 16px; outline: none; /* 16px stops iOS auto-zoom on focus */
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 10px; padding: 9px; border: none; border-radius: 7px;
    background: var(--accent); color: #fff; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  #err { margin-top: 12px; color: #ff6b6b; font-size: 13px; min-height: 1em; }
</style>
</head>
<body>
<div class="card">
  <h1>tmux-webhub</h1>
  <p>Enter the access token to open the session dashboard.</p>
  <form id="f" autocomplete="off">
    <input id="token" type="password" placeholder="token" autofocus>
    <button id="go" type="submit">Unlock</button>
  </form>
  <div id="err"></div>
</div>
<script>
const f = document.getElementById('f');
const err = document.getElementById('err');
f.onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: document.getElementById('token').value.trim() }),
    });
    if (r.ok) { location.href = '/'; return; }
    const j = await r.json().catch(() => ({}));
    err.textContent = j.error || ('HTTP ' + r.status);
  } catch (e2) {
    err.textContent = 'cannot reach server';
  }
  btn.disabled = false;
};
</script>
</body>
</html>
