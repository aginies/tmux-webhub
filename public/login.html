<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tmux-webhub — login</title>
<style>
  :root {
    --bg: #0a0e14; --panel: #11161f; --border: #2a3441; --text: #d8dee9;
    --dim: #8a97a8; --accent: #4fc3f7; --err: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 28px 26px; width: 100%; max-width: 420px;
  }
  h1 { font-size: 17px; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  label { display: block; color: var(--dim); font-size: 12px; margin: 14px 0 4px; }
  input[type=password], input[type=text] {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 10px; font: inherit; letter-spacing: 0.05em;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .code-input { font-size: 22px; letter-spacing: 0.5em; text-align: center; }
  button {
    width: 100%; margin-top: 18px; padding: 10px;
    background: var(--accent); color: #06121c; border: 0; border-radius: 6px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .err { color: var(--err); font-size: 12px; margin-top: 12px; min-height: 16px; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 14px; }
  .step { display: none; }
  .step.active { display: block; }
  .qr { display: flex; justify-content: center; margin: 16px 0 8px; }
  .qr svg { width: 190px; height: 190px; background: #fff; border-radius: 6px; padding: 8px; }
  .secret {
    background: var(--bg); border: 1px dashed var(--border); border-radius: 6px;
    padding: 8px; text-align: center; font-size: 13px; letter-spacing: 0.15em;
    word-break: break-all; margin-bottom: 4px;
  }
  .secret-label { color: var(--dim); font-size: 11px; text-align: center; margin-bottom: 10px; }
  .linkbtn {
    background: none; color: var(--dim); font-weight: 400; margin-top: 10px;
    width: auto; display: inline-block; cursor: pointer; border: 0; padding: 0; font-size: 12px;
  }
  .linkbtn:hover { color: var(--text); }
</style>
</head>
<body>
<div class="card">
  <h1>tmux-webhub</h1>
  <div class="sub">Sign in to your terminal</div>

  <!-- step 1: token -->
  <div class="step active" id="step-token">
    <form id="f-token">
      <label for="token">Token</label>
      <input type="password" id="token" autocomplete="off" autofocus>
      <button type="submit">Continue</button>
      <div class="err" id="err-token"></div>
    </form>
    <button type="button" class="linkbtn" id="enroll-opt" style="display:none">set up two-factor</button>
    <div class="hint">
      <span id="hint-2fa"></span>
    </div>
  </div>

  <!-- step 2: 6-digit code (enroll or verify) -->
  <div class="step" id="step-code">
    <form id="f-code">
      <div id="enroll-ui">
        <div class="sub" id="enroll-sub">Scan with your authenticator app, then enter the 6-digit code.</div>
        <div class="qr" id="qr"></div>
        <div class="secret-label">or enter this secret manually</div>
        <div class="secret" id="secret"></div>
      </div>
      <label for="code" id="code-label">6-digit code</label>
      <input type="text" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" class="code-input">
      <button type="submit" id="code-btn">Verify</button>
      <div class="err" id="err-code"></div>
    </form>
    <button type="button" class="linkbtn" id="back">← back</button>
  </div>
</div>

<script src="/vendor/qrcode.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const show = (id) => {
    document.querySelectorAll('.step').forEach((s) => s.classList.remove('active'));
    $(id).classList.add('active');
  };

  // what does the server expect? (public endpoint, safe before auth)
  fetch('/api/totp/status').then((r) => r.json()).then((s) => {
    $('hint-2fa').textContent = s.enrolled
      ? 'Two-factor is enabled — you will be asked for a 6-digit code.'
      : (s.mode === 'required' ? 'Two-factor is required — you will set it up now.' : '');
    if (s.mode === 'optional' && !s.enrolled) $('enroll-opt').style.display = '';
  }).catch(() => {});

  async function post(url, body) {
    const r = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    let j = {};
    try { j = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, j };
  }

  function showEnroll(j) {
    $('enroll-ui').style.display = '';
    $('enroll-sub').textContent = 'Set up two-factor: scan with your authenticator app, then enter the 6-digit code.';
    $('code-label').textContent = '6-digit code (from your app)';
    $('code-btn').textContent = 'Confirm & sign in';
    $('secret').textContent = j.secret;
    const qr = qrcode(0, 'M');
    qr.addData(j.otpauthUrl);
    qr.make();
    $('qr').innerHTML = qr.createSvgTag({ scalable: true, margin: 0 });
    $('code').value = '';
    show('step-code');
    $('code').focus();
  }

  // token (+ optional enroll flag) → enroll step, or straight in
  async function doLogin(extra) {
    const { ok, status, j } = await post('/login', { token: $('token').value.trim(), ...extra });
    if (ok && j.next === 'enroll') { showEnroll(j); return null; }
    if (ok && j.ok) { location.replace('/'); return null; }
    return { ok, status, j };
  }

  $('f-token').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('err-token').textContent = '';
    const r = await doLogin({});
    if (r) $('err-token').textContent = r.status === 429 ? r.j.error : 'wrong token';
  });

  $('enroll-opt').addEventListener('click', async () => {
    $('err-token').textContent = '';
    const r = await doLogin({ enroll: true });
    if (r) $('err-token').textContent = r.status === 429 ? r.j.error : 'wrong token';
  });

  // step 2 → in
  $('f-code').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('err-code').textContent = '';
    const code = $('code').value.trim();
    if (!/^\d{6}$/.test(code)) { $('err-code').textContent = 'enter the 6-digit code'; return; }
    const { ok, status, j } = await post('/login', { token: $('token').value.trim(), code });
    if (ok) { location.replace('/'); return; }
    $('err-code').textContent = status === 429 ? j.error : (j.error || 'wrong code');
  });

  // back to step 1 (keeps the token, drops any in-flight enrollment)
  $('back').addEventListener('click', () => {
    $('err-code').textContent = '';
    $('code').value = '';
    show('step-token');
    $('token').focus();
  });
</script>
</body>
</html>
